name: Build + push imagem RunPod (TRELLIS)

# Corre numa ligação de datacenter (muito mais rápida que build local) e
# publica a imagem usada por runpod/pod_server.py. Ver runpod/README.md.
on:
  workflow_dispatch: {}
  push:
    branches: [dev, main]
    paths:
      - "runpod/**"
      - ".github/workflows/build-runpod-image.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Libertar espaço em disco (a imagem é grande: CUDA + torch + pesos do TRELLIS)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: runpod/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/2d-to-3d-trellis:latest
