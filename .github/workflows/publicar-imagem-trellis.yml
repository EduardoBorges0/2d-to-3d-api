name: Build + push imagem RunPod (TRELLIS)
on:
  workflow_dispatch: {}
  push:
    branches: [dev, main]
    paths:
      - "runpod/**"
      - ".github/workflows/publicar-imagem-trellis.yml"
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Libertar espaço em disco
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Buildx (necessário para cache-to type=gha)
        uses: docker/setup-buildx-action@v3
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: runpod/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/2d-to-3d-trellis:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
